<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cozy Ramen</title>
  <link rel="preload" href="assets/fonts/CozyPixel.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="stage">
    <canvas id="game" width="960" height="540"></canvas>

    <div id="hud">
      <div class="plaque" id="status">
        <span id="sky" data-icon="sun"></span>
        <span id="day"></span>
        <span class="sep"></span>
        <span id="clock"></span>
        <span id="shopstate" class="pill"></span>
        <span class="sep"></span>
        <span class="coin" data-icon="coin"></span><span id="gold"></span>
        <span class="sep"></span>
        <button id="lvl" class="lvlbtn" type="button" title="Level road" aria-label="Level road"><span id="lvnum">Lv 1</span><span class="xpbar"><i id="xpfill"></i></span></button>
      </div>
      <span class="grow"></span>
      <div class="btnrow">
        <button id="btn-menu" class="ibtn" type="button" title="Menu" aria-label="Menu" data-icon="menu"></button>
        <button id="btn-book" class="ibtn" type="button" title="Recipe book" aria-label="Recipe book" data-icon="book"></button>
        <button id="btn-guests" class="ibtn" type="button" title="Guest book" aria-label="Guest book" data-icon="guests"></button>
        <button id="mute" class="ibtn" type="button" title="Sound on (M)" aria-label="Sound on" data-icon="sound"></button>
        <button id="help" class="ibtn" type="button" title="How to play" aria-label="How to play" data-icon="help"></button>
        <button id="pause" class="ibtn" type="button" title="Pause (Esc)" aria-label="Pause" data-icon="pause"></button>
      </div>
    </div>

    <div id="bubbles">
      <div class="bubble" id="bubble-0"></div>
      <div class="bubble" id="bubble-1"></div>
      <div class="bubble" id="bubble-2"></div>
      <div class="bubble" id="bubble-3"></div>
      <div class="bubble" id="bubble-4"></div>
      <div class="bubble" id="bubble-5"></div>
      <div class="bubble" id="bubble-6"></div>
      <div class="bubble" id="bubble-7"></div>
    </div>

    <div id="toast" class="jrpg"></div>

    <div id="dialog" class="jrpg">
      <div class="dlg-face"><canvas id="dlg-face" width="112" height="112"></canvas></div>
      <div class="dlg-main">
        <div class="dlg-head"><span id="dlg-name"></span><span id="dlg-title"></span></div>
        <div id="dlg-text"></div>
        <div id="dlg-choices"></div>
        <div id="dlg-next">&#9660;</div>
      </div>
    </div>

    <div id="bar">
      <button id="tab-serving" class="tag on" type="button"><span class="ti" data-icon="serving"></span>Serving<span class="badge" id="badge-serving"></span></button>
      <button id="tab-kitchen" class="tag" type="button"><span class="ti" data-icon="kitchen"></span>Kitchen<span class="badge" id="badge-kitchen"></span></button>
      <button id="tab-street" class="tag gone" type="button" title="Night street: Aoi's supply shop"><span class="ti" data-icon="street"></span>Street</button>
      <span id="hint"></span>
    </div>

    <!-- the daily quest: a card in the bottom-right corner; the header button folds it down to a small chip -->
    <div id="quest" class="washi hide" aria-label="Daily quest">
      <button id="quest-head" type="button" aria-expanded="true" title="Hide quest">
        <span class="q-ico"></span><span class="q-tag">Daily quest</span><span id="quest-n"></span><span class="q-tog"></span>
      </button>
      <div class="q-body"><span id="quest-text"></span><span class="q-bar"><i id="quest-fill"></i></span><span id="quest-reward"></span></div>
    </div>

    <div id="menu" class="overlay">
      <div class="paper menu-paper framed">
        <div id="menu-body"></div>
        <button id="menu-close" class="close" type="button">Close</button>
      </div>
    </div>

    <!-- the two physical books: js/pbook.js builds what is inside -->
    <div id="book" class="overlay pbook" aria-label="Recipe book"></div>
    <div id="guests" class="overlay pbook" aria-label="Guest book"></div>

    <div id="road" class="overlay journey" aria-label="Ramen Road">
      <canvas id="map" width="960" height="540"></canvas>
      <div class="jr-top">
        <div class="jr-title wood"><b>Ramen Road</b><span id="jr-count"></span></div>
        <div class="jr-stats wood"><span id="jr-lv" class="lvchip"></span><span class="xpbar"><i id="jr-xp"></i></span><span id="jr-xptext"></span><span id="jr-gold" class="jr-gold"></span></div>
        <button id="road-close" class="close" type="button">Close</button>
      </div>
      <div class="jr-shop washi"><span>Shop location</span><div id="jr-regions"></div></div>
      <div id="jr-card" class="jr-card washi"></div>
    </div>
    </div>

    <!-- Kitsune-ya, the night supply shop (js/nightshop.js): the inspect card and the talk / checkout panel -->
    <div id="nshop">
      <div id="ns-card" class="ns-card jrpg" aria-live="polite"></div>
      <div id="ns-talk" class="ns-talk jrpg">
        <div class="ns-face" role="img" aria-label="Aoi"></div>
        <div class="ns-main">
          <div class="dlg-head"><span class="ns-name">Aoi</span><span class="ns-title">Kitsune shopkeeper</span></div>
          <div id="ns-text"></div>
          <div id="ns-body"></div>
          <div id="ns-choices"></div>
        </div>
      </div>
    </div>

    <div id="levelup" aria-live="polite">
      <div class="lu-flash"></div>
      <div class="lu-rays"></div>
      <div class="lu-sparks" id="lu-sparks"></div>
      <div class="lu-card jrpg">
        <div class="lu-banner" id="lu-banner"></div>
        <div class="lu-level"><span class="lu-lv">LV</span><span class="lu-old" id="lu-old"></span><span class="lu-arrow">&#9654;</span><span class="lu-new" id="lu-new"></span></div>
        <div class="lu-sub" id="lu-sub"></div>
        <ul class="lu-list" id="lu-list"></ul>
        <button id="lu-btn" type="button">Wonderful!</button>
      </div>
    </div>

    <div id="modal">
      <div class="panel framed">
        <div id="modal-body"></div>
        <button id="modal-btn" type="button"></button>
      </div>
    </div>
  </div>

  <script src="js/ui.js"></script>
  <script src="js/fontdata.js"></script>
  <script src="js/px.js"></script>
  <script src="js/data.js"></script>
  <script src="js/guests.js"></script>
  <script src="js/personas.js"></script>
  <script src="js/aoi.js"></script>
  <script src="js/art.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/cats.js"></script>
  <script src="js/kitchen.js"></script>
  <script src="js/serving.js"></script>
  <script src="js/title.js"></script>
  <script src="js/loading.js"></script>
  <script src="js/pbook.js"></script>
  <script src="js/bookfilter.js"></script>
  <script src="js/cookbook.js"></script>
  <script src="js/guestbook.js"></script>
  <script src="js/journey.js"></script>
  <script src="js/nightshop.js"></script>
  <script src="js/tutorial.js"></script>
  <script src="js/facetool.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
